name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
assignees: ["manos-grigorakis"]

body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Describe the issue, including steps to reproduce it when applicable.
      placeholder: |
        What happened?
        When does the issue occur?
        How can it be reproduced?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what should happen instead.
      placeholder: What is the expected result?
    validations:
      required: true

  - type: textarea
    id: debug-information
    attributes:
      label: Debug Information
      description: Provide relevant logs, error messages, stack traces, or API responses.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add screenshots, environment details, or any other relevant information.
    validations:
      required: false
