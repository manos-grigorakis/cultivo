server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress HTTP responses
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    
    location /api/ {
        # Backend proxy to backend through Docker DNS
        proxy_pass http://backend:8080;

        # Preserve the original request host
        proxy_set_header Host $host;

        # Forward the request protocol (HTTP/HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        # Cache versioned Vite assets for one year
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Fallback to index.html for Vue Router client-side routing
        try_files $uri $uri/ /index.html;
    }
}